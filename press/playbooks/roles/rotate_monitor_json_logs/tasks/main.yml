---
- name: Ensure logrotate configuration for monitor.json.log
  copy:
    dest: /etc/logrotate.d/monitor_json_logs
    content: |
      # Aretenic (ADR 043 §5): all bench logs, 30 days, compressed. One stanza, since logrotate
      # refuses a file matched by two.
      /home/frappe/benches/*/logs/*.log {
          maxsize 200M
          daily
          rotate 30
          missingok
          notifempty
          compress
          delaycompress
          copytruncate
      }
- name: Force logrotate to apply new configuration
  command: logrotate -f /etc/logrotate.d/monitor_json_logs
