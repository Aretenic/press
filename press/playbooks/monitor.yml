---
- name: Setup Monitor Server
  hosts: all
  become: yes
  become_user: root
  gather_facts: yes
  roles:
    - role: essentials
    - role: block_sctp
    - role: user
    - role: nginx
    - role: agent
    - role: node_exporter
    - role: prometheus
    - role: alertmanager
    - role: blackbox_exporter
    - role: grafana
    - role: fail2ban
    - role: iptables  # Aretenic (decisions 103): last, so Docker is set up first
