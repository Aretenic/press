---
- name: Setup Proxy Server
  hosts: all
  become: yes
  become_user: root
  gather_facts: yes
  roles:
    - role: essentials
    - role: block_sctp
    - role: user
    - role: nginx
    - role: agent
    - role: proxy
    - role: node_exporter
    - role: user_ssh_certificate
    - role: filebeat
    - role: auditd
    - role: clamav
    - role: fail2ban
    - role: iptables  # Aretenic (decisions 103): last, so Docker is set up first
